# SPDX-License-Identifier: Apache-2.0
name: Validar catálogo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estructura y estado
        run: python herramientas/validar_catalogo.py

      - name: Comprobar navegación entre clases
        run: python herramientas/actualizar_navegacion.py --check

      - name: Validar recorridos por rol
        run: python herramientas/validar_recorridos.py

      - name: Comprobar distribución de módulos
        run: python herramientas/consolidar_distribucion.py --check

      - name: Validar colocación de módulos en áreas y bloques
        run: python herramientas/validar_colocacion.py

      - name: Comprobar guías por rol
        run: python herramientas/generar_rutas_por_rol.py --check

      - name: Validar talleres de misión
        run: python herramientas/validar_talleres.py

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar simuladores (datos de JPL, motor JavaScript, páginas y documentación)
        run: python herramientas/validar_simuladores.py
