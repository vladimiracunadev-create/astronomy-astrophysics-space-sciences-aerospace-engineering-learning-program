# SPDX-License-Identifier: Apache-2.0
name: Validar catálogo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estructura y estado
        run: python herramientas/validar_catalogo.py

      - name: Comprobar navegación entre clases
        run: python herramientas/actualizar_navegacion.py --check

      - name: Validar recorridos por rol
        run: python herramientas/validar_recorridos.py

      - name: Comprobar recorridos generados
        run: python herramientas/generar_recorridos.py --check
