# SPDX-License-Identifier: Apache-2.0
name: Publicar sitio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del sitio
        run: python -m pip install markdown Pillow

      - name: Generar sitio (inicio, áreas, roles, anexos, glosarios y búsqueda)
        run: python herramientas/publicacion/sitio.py

      - name: Comprobar que el sitio está completo
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html buscar.html areas.html roles.html manifest.webmanifest service-worker.js \
                   assets/landing.js assets/datos.js indice-busqueda.js visor/index.html \
                   programa/clases/B71/B71-C18-maniobra-de-hohmann/CLASE.html \
                   anexos/README.html glosario/README.html glosario/esencial/README.html; do
            test -s "build/web/$f"
          done
          CLASES=$(find build/web/programa/clases -name CLASE.html | wc -l)
          echo "Páginas de clase: $CLASES"
          test "$CLASES" -eq 2077
          grep -q "Hohmann" build/web/indice-busqueda.js

      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
