<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" width="980" height="320" role="img" aria-labelledby="t d"><title id="t">Probabilidad de que los 344 despliegues salgan bien</title><desc id="d">Cuatro barras: con 99,9 % por punto el éxito global es 71 %; con 99,999 %, 99,7 %.</desc><rect width="980" height="320" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Probabilidad de que los 344 despliegues salgan bien</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Cadena en serie de puntos únicos de fallo</text><text x="318.0" y="109.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,900 % por punto</text><rect x="330.0" y="90" width="398.3" height="26" fill="#c1440e"/><text x="736.3" y="109.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">70,9 %</text><text x="318.0" y="149.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,950 % por punto</text><rect x="330.0" y="130" width="473.1" height="26" fill="#e0a800"/><text x="811.1" y="149.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">84,2 %</text><text x="318.0" y="189.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,990 % por punto</text><rect x="330.0" y="170" width="542.9" height="26" fill="#1f77b4"/><text x="880.9" y="189.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">96,6 %</text><text x="318.0" y="229.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,999 % por punto</text><rect x="330.0" y="210" width="560.0" height="26" fill="#2a7f62"/><text x="898.0" y="229.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,7 %</text><text x="24.0" y="302.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Para un 90 % global hace falta 99.969 % por punto: por eso se probó durante años.</text></svg>