<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-labelledby="t d"><title id="t">Geometría del punto L2</title><desc id="d">Sol, Tierra y L2 alineados; el telescopio describe una órbita amplia alrededor de L2, a 1,5 millones de km de la Tierra.</desc><rect width="980" height="470" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dónde está el telescopio: el punto L2 Sol-Tierra</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Esquema fuera de escala visto desde arriba del plano de la eclíptica</text><line x1="60" y1="260" x2="920" y2="260" stroke="#8a96a3" stroke-dasharray="5 5"/><circle cx="110" cy="260" r="34" fill="#e0a800"/><text x="110.0" y="320.0" font-size="14" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sol</text><circle cx="520" cy="260" r="14" fill="#1f77b4"/><text x="520.0" y="296.0" font-size="14" fill="#1f77b4" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Tierra</text><circle cx="640" cy="260" r="6" fill="#1d2733"/><text x="640.0" y="288.0" font-size="14" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">L2</text><ellipse cx="640" cy="260" rx="60" ry="96" fill="none" stroke="#2a7f62" stroke-width="3.5"/><text x="640.0" y="148.0" font-size="13" fill="#2a7f62" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Órbita alrededor de L2</text><text x="640.0" y="130.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 800.000 km de ancho, ≈ 6 meses</text><line x1="520" y1="312" x2="640" y2="312" stroke="#5b6b7c"/><text x="580.0" y="332.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 1,5 millones de km · 5 s luz</text><text x="110.0" y="200.0" font-size="13" fill="#e0a800" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Luz solar →</text><text x="24.0" y="440.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">En L2 el Sol, la Tierra y la Luna quedan siempre del mismo lado: un solo escudo basta para taparlos a los tres.</text></svg>