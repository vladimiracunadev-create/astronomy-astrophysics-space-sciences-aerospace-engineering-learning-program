<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">James Webb: del lanzamiento a la primera imagen</title><desc id="d">Línea de tiempo con ocho hitos desde el lanzamiento hasta las primeras imágenes científicas.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">James Webb: del lanzamiento a la primera imagen</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Fechas de referencia pública, redondeadas: verifica en la fuente.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="324.3" y="240.0" width="585.7" height="20" fill="#c1440e" opacity="0.18"/><text x="617.1" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">≈ 2 semanas de despliegues sin posibilidad de reparación</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">25 dic 2021</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Ariane 5, Kourou</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">+33 min</text><text x="207.1" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Paneles solares</text><text x="207.1" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">se separan y se abren</text><line x1="324.3" y1="250.0" x2="324.3" y2="186.0" stroke="#5b6b7c"/><circle cx="324.3" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="324.3" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">+2 días</text><text x="324.3" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Antena y carga</text><text x="324.3" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">primeros despliegues</text><line x1="441.4" y1="250.0" x2="441.4" y2="296.0" stroke="#5b6b7c"/><circle cx="441.4" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="441.4" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 3 a 7</text><text x="441.4" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Escudo solar</text><text x="441.4" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5 capas, 21 m x 14 m</text><line x1="558.6" y1="250.0" x2="558.6" y2="186.0" stroke="#5b6b7c"/><circle cx="558.6" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="558.6" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 14</text><text x="558.6" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Espejo secundario</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">y alas del primario</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">24 ene 2022</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Llegada a L2</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">quema de inserción</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Feb a May</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Alineación</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">18 segmentos como uno</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">12 jul 2022</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Primeras imágenes</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">ciencia comienza</text><text x="24.0" y="430.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">A 1,5 millones de km nadie puede ir a arreglar nada: todo debe funcionar la primera vez.</text></svg>