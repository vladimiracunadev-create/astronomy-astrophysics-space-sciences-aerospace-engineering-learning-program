<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="t d"><title id="t">Cuánta energía solar llega a cada lugar</title><desc id="d">Cinco barras: desde 1,4 kW/m² en la Tierra hasta 647 kW/m² en el perihelio récord.</desc><rect width="980" height="360" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Cuánta energía solar llega a cada lugar</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Flujo solar en kW por metro cuadrado</text><text x="318.0" y="109.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tierra (1 UA)</text><rect x="330.0" y="90" width="2.0" height="26" fill="#1f77b4"/><text x="340.0" y="109.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1,4 kW/m²</text><text x="318.0" y="149.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Venus (0,72 UA)</text><rect x="330.0" y="130" width="2.3" height="26" fill="#c1440e"/><text x="340.3" y="149.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2,6 kW/m²</text><text x="318.0" y="189.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Mercurio (0,39 UA)</text><rect x="330.0" y="170" width="7.9" height="26" fill="#e0a800"/><text x="345.9" y="189.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">9,1 kW/m²</text><text x="318.0" y="229.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Primer perihelio (0,166 UA)</text><rect x="330.0" y="210" width="42.7" height="26" fill="#6a4fb0"/><text x="380.7" y="229.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">49,4 kW/m²</text><text x="318.0" y="269.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Perihelio récord (0,046 UA)</text><rect x="330.0" y="250" width="560.0" height="26" fill="#2a7f62"/><text x="898.0" y="269.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">647,3 kW/m²</text><text x="24.0" y="342.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">En el perihelio récord el flujo es 476 veces el de la Tierra: por eso el escudo y los paneles son el corazón del diseño.</text></svg>