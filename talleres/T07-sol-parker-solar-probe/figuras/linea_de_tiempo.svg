<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">Parker Solar Probe: 7 años acercándose al Sol</title><desc id="d">Línea de tiempo con ocho hitos del lanzamiento de 2018 al perihelio récord de 2024.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Parker Solar Probe: 7 años acercándose al Sol</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Fechas de referencia pública, redondeadas: verifica en la fuente.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="792.9" y="240.0" width="117.1" height="20" fill="#c1440e" opacity="0.18"/><text x="851.4" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Perihelios dentro de la corona</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">12 ago 2018</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Delta IV Heavy, C3 récord</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3 oct 2018</text><text x="207.1" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Venus 1</text><text x="207.1" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">primer freno</text><line x1="324.3" y1="250.0" x2="324.3" y2="186.0" stroke="#5b6b7c"/><circle cx="324.3" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="324.3" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5 nov 2018</text><text x="324.3" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Primer perihelio</text><text x="324.3" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">35,7 radios solares</text><line x1="441.4" y1="250.0" x2="441.4" y2="296.0" stroke="#5b6b7c"/><circle cx="441.4" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="441.4" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2018 a 2024</text><text x="441.4" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Siete Venus</text><text x="441.4" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">perihelio cada vez menor</text><line x1="558.6" y1="250.0" x2="558.6" y2="186.0" stroke="#5b6b7c"/><circle cx="558.6" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="558.6" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">29 abr 2021</text><text x="558.6" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Entra en la corona</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">cruza la superficie de Alfvén</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">6 nov 2024</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Venus 7</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">último freno</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">24 dic 2024</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Perihelio récord</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">9,86 radios solares</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2025</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Fin de la misión primaria</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">órbitas de 88 días</text><text x="24.0" y="430.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">En el perihelio la nave va a ≈ 690.000 km/h, el objeto más rápido construido por personas.</text></svg>