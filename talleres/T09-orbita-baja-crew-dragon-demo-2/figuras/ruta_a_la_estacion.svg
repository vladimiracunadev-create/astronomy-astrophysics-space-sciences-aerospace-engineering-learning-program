<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img" aria-labelledby="t d"><title id="t">Crew Dragon: de la plataforma a la estación en 19 horas</title><desc id="d">Esquema con la Tierra al centro, la órbita de la estación, una órbita más baja de espera y el recorrido de la nave hasta alcanzarla.</desc><rect width="980" height="700" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Crew Dragon: de la plataforma a la estación en 19 horas</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Vista desde el polo norte · la altura de las órbitas está exagerada 4 veces</text><circle cx="490.0" cy="330.0" r="208.5" fill="none" stroke="#c1440e" stroke-width="1.5" stroke-dasharray="4 4"/><circle cx="490.0" cy="330.0" r="185.7" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M652.5,358.7 L655.9,349.5 L658.8,340.0 L661.2,330.3 L663.0,320.3 L664.2,310.1 L664.8,299.8 L664.8,289.3 L664.2,278.7 L662.9,268.1 L661.0,257.4 L656.5,247.7 L651.5,238.3 L645.9,229.1 L639.9,220.3 L633.3,211.9 L626.3,203.8 L618.8,196.2 L610.9,189.0 L602.5,182.3 L593.9,176.0 L584.8,170.3 L575.5,165.1 L565.8,160.5 L556.0,156.4 L545.8,152.9 L535.6,150.0 L525.1,147.6 L514.6,145.9 L503.9,144.8 L493.2,144.3 L482.5,144.4 L471.9,145.2 L461.3,146.5 L450.8,148.5 L440.4,151.0 L430.1,154.2 L420.1,157.9 L410.3,162.2 L400.8,167.1 L391.6,172.5 L382.7,178.4 L374.1,184.9 L366.0,191.8 L358.2,199.1 L350.9,206.9 L344.0,215.1 L337.7,223.7 L331.8,232.7 L326.5,242.0 L321.7,251.5 L317.4,261.3 L313.8,271.4 L310.7,281.6 L308.2,292.0 L306.3,302.5 L305.0,313.2 L304.4,323.8 L304.3,334.5 L304.9,345.2 L306.1,355.8 L308.3,368.6 L310.1,379.2 L312.5,389.7 L315.6,400.1 L319.2,410.4 L323.4,420.4 L328.3,430.3 L333.7,439.8 L339.7,449.1 L346.2,458.1 L353.3,466.7 L360.9,474.9 L369.0,482.7 L377.5,490.0 L386.5,496.9 L395.9,503.2 L405.8,509.0 L415.9,514.3 L426.4,519.0 L437.2,523.1 L448.2,526.5 L459.5,529.3 L471.0,531.5 L482.6,533.0 L494.3,533.9 L506.1,534.1 L517.9,533.6 L529.7,532.4 L541.5,530.5 L553.2,527.9 L564.7,524.6" fill="none" stroke="#2a7f62" stroke-width="3.5"/><circle cx="490.0" cy="330.0" r="165" fill="#1f77b4"/><text x="490.0" y="513.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Tierra</text><circle cx="652.5" cy="358.7" r="6" fill="#1f77b4" stroke="#fff" stroke-width="1.5"/><text x="666.5" y="380.7" font-size="13" fill="#1f77b4" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><circle cx="564.7" cy="524.6" r="6" fill="#2a7f62" stroke="#fff" stroke-width="1.5"/><text x="576.7" y="512.6" font-size="13" fill="#2a7f62" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Acoplamiento</text><circle cx="526.2" cy="124.7" r="6" fill="#c1440e" stroke="#fff" stroke-width="1.5"/><text x="538.2" y="112.7" font-size="13" fill="#c1440e" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Estación</text><text x="24.0" y="652.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">La nave sube a ≈ 200 km y, al ser más rápida, alcanza a la estación: gana ≈ 17° por vuelta.</text><text x="24.0" y="674.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Esquema: la geometría real exige un ángulo de fase y quemas precisas.</text></svg>