f">Desacople</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">regreso a la Tierra</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 ago 2020</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Quema de salida</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 100 m/s</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 ago 2020</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Entrada</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 7,8 km/s, hasta ≈ 4 g</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2 ago 2020</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Amerizaje</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-famil