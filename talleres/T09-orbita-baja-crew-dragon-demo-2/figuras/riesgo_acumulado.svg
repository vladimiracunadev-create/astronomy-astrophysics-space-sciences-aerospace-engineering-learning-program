<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" role="img" aria-labelledby="t d"><title id="t">Probabilidad de que una tripulación vuelva sana en 10 vuelos</title><desc id="d">Tres barras: 86,1 % con el riesgo del transbordador, 96,4 % con el requisito de 1 en 270 y 99,0 % con 1 en 1.000.</desc><rect width="980" height="280" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Probabilidad de que una tripulación vuelva sana en 10 vuelos</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Porcentaje con cada nivel de riesgo por vuelo (supuesto de vuelos independientes)</text><text x="318.0" y="109.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Transbordador (2 pérdidas en 135 vuelos)</text><rect x="330.0" y="90" width="487.2" height="26" fill="#c1440e"/><text x="825.2" y="109.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">86,1 %</text><text x="318.0" y="149.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Requisito actual (1 en 270)</text><rect x="330.0" y="130" width="545.0" height="26" fill="#e0a800"/><text x="883.0" y="149.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">96,4 %</text><text x="318.0" y="189.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Objetivo ambicioso (1 en 1.000)</text><rect x="330.0" y="170" width="560.0" height="26" fill="#2a7f62"/><text x="898.0" y="189.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">99,0 %</text><text x="24.0" y="262.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Un riesgo que parece pequeño por vuelo se acumula: tras diez vuelos, el transbordador implicaba un 14 % de perder una tripulación.</text></svg>