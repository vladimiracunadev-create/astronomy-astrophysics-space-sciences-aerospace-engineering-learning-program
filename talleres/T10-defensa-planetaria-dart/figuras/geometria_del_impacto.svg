<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" role="img" aria-labelledby="t d"><title id="t">Geometría del impacto de DART</title><desc id="d">Didymos al centro, la órbita de Dimorphos alrededor y la nave llegando de frente, en sentido contrario al movimiento de Dimorphos.</desc><rect width="980" height="590" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">El impacto de DART sobre Dimorphos</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Esquema fuera de escala visto desde el polo del sistema</text><circle cx="400.0" cy="300.0" r="170.0" fill="none" stroke="#8a96a3" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="400.0" cy="300.0" r="52" fill="#e0a800" opacity="0.9"/><text x="400.0" y="305.0" font-size="14" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Didymos</text><text x="400.0" y="376.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 780 m</text><circle cx="539.3" cy="202.5" r="14" fill="#1f77b4"/><text x="561.3" y="230.5" font-size="13" fill="#1f77b4" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Dimorphos ≈ 160 m</text><line x1="539.3" y1="202.5" x2="499.1" y2="145.2" stroke="#2a7f62" stroke-width="3.5"/><polygon points="499.1,145.2 512.9,152.6 501.4,160.6" fill="#2a7f62"/><text x="491.1" y="133.2" font-size="13" fill="#2a7f62" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Su velocidad: ≈ 17 cm/s</text><line x1="688.4" y1="415.5" x2="549.6" y2="217.2" stroke="#c1440e" stroke-width="3.5"/><polygon points="549.6,217.2 564.5,226.3 553.0,234.4" fill="#c1440e"/><text x="696.4" y="419.5" font-size="13" fill="#c1440e" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Nave: 580 kg a 6,1 km/s</text><text x="24.0" y="540.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">El golpe va de frente, contra el sentido del movimiento: frena a Dimorphos unos 3 mm/s y acorta su período.</text><text x="24.0" y="562.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Los restos expulsados empujan más que la nave sola; ese refuerzo se mide con el factor β.</text></svg>