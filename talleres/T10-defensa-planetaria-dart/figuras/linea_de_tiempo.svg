<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">DART: del lanzamiento al resultado en 10 meses</title><desc id="d">Línea de tiempo con ocho hitos desde el lanzamiento de 2021 hasta la llegada prevista de la misión Hera.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">DART: del lanzamiento al resultado en 10 meses</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Fechas de referencia pública, redondeadas: verifica en la fuente.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="441.4" y="240.0" width="468.6" height="20" fill="#c1440e" opacity="0.18"/><text x="675.7" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Del impacto al resultado: 15 días</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">24 nov 2021</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Falcon 9, Vandenberg</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Aria