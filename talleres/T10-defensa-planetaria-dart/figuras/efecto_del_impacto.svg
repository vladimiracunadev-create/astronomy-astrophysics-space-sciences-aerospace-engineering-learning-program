<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-labelledby="t d"><title id="t">Cuánto cambia el período con el factor β</title><desc id="d">Recta creciente: el acortamiento del período crece con β; la medición de ≈ 33 minutos corresponde a β cercano a 3,3.</desc><rect width="980" height="480" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Cuánto cambia el período con el factor β</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Minutos que se acorta el período de Dimorphos según el modelo (impacto frontal)</text><rect x="100.0" y="90.0" width="790.0" height="300.0" fill="none" stroke="#5b6b7c"/><line x1="100.0" y1="390.0" x2="890.0" y2="390.0" stroke="#e3e8ee"/><text x="90.0" y="394.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">0,0</text><line x1="100.0" y1="315.0" x2="890.0" y2="315.0" stroke="#e3e8ee"/><text x="90.0" y="319.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">20</text><line x1="100.0" y1="240.0" x2="890.0" y2="240.0" stroke="#e3e8ee"/><text x="90.0" y="244.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">40</text><line x1="100.0" y1="165.0" x2="890.0" y2="165.0" stroke="#e3e8ee"/><text x="90.0" y="169.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">60</text><line x1="100.0" y1="90.0" x2="890.0" y2="90.0" stroke="#e3e8ee"/><text x="90.0" y="94.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">80</text><text x="100.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">0</text><text x="231.7" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1</text><text x="363.3" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2</text><text x="495.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3</text><text x="626.7" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4</text><text x="758.3" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5</text><text x="890.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">6</text><polyline points="100.0,390.0 126.3,382.4 152.7,374.8 179.0,367.2 205.3,359.6 231.7,352.0 258.0,344.4 284.3,336.8 310.7,329.2 337.0,321.6 363.3,314.0 389.7,306.4 416.0,298.8 442.3,291.2 468.7,283.6 495.0,276.0 521.3,268.4 547.7,260.8 574.0,253.2 600.3,245.6 626.7,238.0 653.0,230.4 679.3,222.8 705.7,215.2 732.0,207.6 758.3,200.0 784.7,192.4 811.0,184.8 837.3,177.2 863.7,169.6 890.0,162.0" fill="none" stroke="#2a7f62" stroke-width="3.5"/><circle cx="534.5" cy="264.6" r="5" fill="#1d2733" stroke="#fff" stroke-width="1.5"/><text x="534.5" y="252.6" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">≈ 33 min</text><text x="495.0" y="434.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Factor de aumento β</text><text x="24.0" y="240.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">minutos</text><text x="24.0" y="464.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Con β = 1 solo contaría la nave; lo observado exige β ≈ 3,3 a 3,6: los restos expulsados triplicaron el efecto.</text></svg>