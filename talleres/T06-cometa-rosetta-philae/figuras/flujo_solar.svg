<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-labelledby="t d"><title id="t">Cuánta luz solar llega a los paneles</title><desc id="d">Curva decreciente del flujo solar con tres marcas: 1,24 UA en el perihelio, 3,4 UA en la llegada y 5,3 UA en la hibernación.</desc><rect width="980" height="480" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Cuánta luz solar llega a los paneles</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Flujo solar en W/m² frente a la distancia al Sol (escala logarítmica en el eje vertical)</text><rect x="100.0" y="90.0" width="790.0" height="300.0" fill="none" stroke="#5b6b7c"/><line x1="100.0" y1="390.0" x2="890.0" y2="390.0" stroke="#e3e8ee"/><text x="90.0" y="394.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">30</text><line x1="100.0" y1="287.0" x2="890.0" y2="287.0" stroke="#e3e8ee"/><text x="90.0" y="291.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">100</text><line x1="100.0" y1="193.0" x2="890.0" y2="193.0" stroke="#e3e8ee"/><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">300</text><line x1="100.0" y1="90.0" x2="890.0" y2="90.0" stroke="#e3e8ee"/><text x="90.0" y="94.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1.000</text><text x="100.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1</text><text x="258.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2</text><text x="416.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3</text><text x="574.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4</text><text x="732.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5</text><text x="890.0" y="410.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">6</text><polyline points="100.0,63.6 131.6,94.8 163.2,121.2 194.8,144.1 226.4,164.2 258.0,182.2 289.6,198.5 321.2,213.4 352.8,227.1 384.4,239.8 416.0,251.6 447.6,262.7 479.2,273.0 510.8,282.8 542.4,292.1 574.0,300.8 605.6,309.2 637.2,317.1 668.8,324.8 700.4,332.0 732.0,339.0 763.6,345.7 795.2,352.2 826.8,358.4 858.4,364.4 890.0,370.2" fill="none" stroke="#e0a800" stroke-width="3.5"/><circle cx="137.9" cy="100.4" r="5" fill="#1d2733" stroke="#fff" stroke-width="1.5"/><text x="137.9" y="88.4" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Perihelio</text><circle cx="479.2" cy="273.0" r="5" fill="#1d2733" stroke="#fff" stroke-width="1.5"/><text x="479.2" y="261.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Llegada</text><circle cx="779.4" cy="349.0" r="5" fill="#1d2733" stroke="#fff" stroke-width="1.5"/><text x="779.4" y="337.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hibernación</text><text x="495.0" y="434.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Distancia al Sol (UA)</text><text x="24.0" y="240.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">W/m²</text><text x="24.0" y="464.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">A 5,3 UA llega 28 veces menos luz que a la Tierra: la nave se apagó casi por completo para sobrevivir.</text></svg>