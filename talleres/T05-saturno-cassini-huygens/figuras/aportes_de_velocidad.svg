<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="t d"><title id="t">Cuánto aporta cada ayuda</title><desc id="d">Cinco barras: la energía necesaria al salir es mayor que el aporte del cohete; los sobrevuelos cambian la velocidad en varios km/s.</desc><rect width="980" height="360" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Cuánto aporta cada ayuda</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Velocidades en km/s del modelo de dos cuerpos (orden de magnitud)</text><text x="318.0" y="109.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Energía necesaria al salir (v∞)</text><rect x="330.0" y="90" width="560.0" height="26" fill="#8a96a3"/><text x="898.0" y="109.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">10,29 km/s</text><text x="318.0" y="149.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Aporte del cohete (v∞ ≈ 4,1)</text><rect x="330.0" y="130" width="223.1" height="26" fill="#1f77b4"/><text x="561.1" y="149.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4,10 km/s</text><text x="318.0" y="189.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Giro por la Tierra, 1999</text><rect x="330.0" y="170" width="287.2" height="26" fill="#2a7f62"/><text x="625.2" y="189.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5,28 km/s</text><text x="318.0" y="229.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Giro por Júpiter, 2000</text><rect x="330.0" y="210" width="177.9" height="26" fill="#e0a800"/><text x="515.9" y="229.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">3,27 km/s</text><text x="318.0" y="269.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Freno de inserción en Saturno</text><rect x="330.0" y="250" width="33.4" height="26" fill="#c1440e"/><text x="371.4" y="269.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">0,61 km/s</text><text x="24.0" y="342.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Sin asistencias, el cohete no alcanzaba: la gravedad de los planetas completó lo que faltaba.</text></svg>