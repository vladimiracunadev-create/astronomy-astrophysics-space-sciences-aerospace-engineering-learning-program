<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">New Horizons: 13 años en ocho hitos</title><desc id="d">Línea de tiempo con ocho hitos desde el lanzamiento de 2006 hasta el sobrevuelo de Arrokoth.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">New Horizons: 13 años en ocho hitos</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Fechas de referencia pública, redondeadas: verifica en la fuente.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="558.6" y="240.0" width="351.4" height="20" fill="#c1440e" opacity="0.18"/><text x="734.3" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">10 días entre la anomalía y el sobrevuelo</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Ene 2006</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Atlas V + tercera etapa</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Feb 2007</text><text x="207.1" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Júpiter</text><text x="207.1" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">asistencia gravitatoria</text><line x1="324.3" y1="250.0" x2="324.3" y2="186.0" stroke="#5b6b7c"/><circle cx="324.3" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="324.3" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2007-2014</text><text x="324.3" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Hibernación</text><text x="324.3" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 1.870 días en reposo</text><line x1="441.4" y1="250.0" x2="441.4" y2="296.0" stroke="#5b6b7c"/><circle cx="441.4" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="441.4" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Dic 2014</text><text x="441.4" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Despertar</text><text x="441.4" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">fin de la hibernación</text><line x1="558.6" y1="250.0" x2="558.6" y2="186.0" stroke="#5b6b7c"/><circle cx="558.6" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="558.6" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">4 jul 2015</text><text x="558.6" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Modo seguro</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">10 días antes del sobrevuelo</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">14 jul 2015</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sobrevuelo</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">a ≈ 12.500 km</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Oct 2016</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Fin de la descarga</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 16 meses de transmisión</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1 ene 2019</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Arrokoth</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">segundo objetivo</text><text x="24.0" y="430.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">El encuentro dura horas; el viaje, casi una década; recibir los datos, más de un año.</text></svg>