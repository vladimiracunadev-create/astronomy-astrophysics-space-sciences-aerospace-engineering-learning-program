<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">Artemis I: 25,5 días en ocho hitos</title><desc id="d">Línea de tiempo con ocho hitos de la misión Artemis I.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Artemis I: 25,5 días en ocho hitos</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Fechas relativas al lanzamiento del 16 de noviembre de 2022 (UTC). Cifras redondeadas: verifica en la fuente.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="792.9" y="240.0" width="117.1" height="20" fill="#c1440e" opacity="0.18"/><text x="851.4" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Reentrada con rebote: ≈ 11 km/s</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 0</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Lanzamiento</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">SLS, plataforma 39B</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 0 (≈ 1,5 h)</text><text x="207.1" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Inyección translunar</text><text x="207.1" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">motor de la etapa superior</text><line x1="324.3" y1="250.0" x2="324.3" y2="186.0" stroke="#5b6b7c"/><circle cx="324.3" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="324.3" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 5</text><text x="324.3" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sobrevuelo lunar</text><text x="324.3" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">a ≈ 130 km</text><line x1="441.4" y1="250.0" x2="441.4" y2="296.0" stroke="#5b6b7c"/><circle cx="441.4" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="441.4" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 9</text><text x="441.4" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Entrada en la DRO</text><text x="441.4" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">quema de inserción</text><line x1="558.6" y1="250.0" x2="558.6" y2="186.0" stroke="#5b6b7c"/><circle cx="558.6" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="558.6" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 12</text><text x="558.6" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Distancia máxima</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 432.000 km</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 15</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Salida de la DRO</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">quema de salida</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 19</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sobrevuelo de regreso</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">con motor, ≈ 130 km</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Día 25,5</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Amerizaje</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Pacífico, Baja California</text><text x="24.0" y="430.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">El retorno desde la Luna es la prueba que no se podía hacer desde órbita baja: 2,8 veces más flujo de calor.</text></svg>