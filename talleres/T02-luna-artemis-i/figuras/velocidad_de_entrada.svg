<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 280" width="980" height="280" role="img" aria-labelledby="t d"><title id="t">Velocidad de entrada en la atmósfera</title><desc id="d">Tres barras con la velocidad de entrada: 5,4 km/s en Marte, 7,8 desde órbita baja y 11,1 desde la Luna.</desc><rect width="980" height="280" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Velocidad de entrada en la atmósfera</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Velocidad al llegar a la interfaz de entrada (km/s)</text><text x="318.0" y="109.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Entrada en Marte (Mars 2020)</text><rect x="330.0" y="90" width="273.1" height="26" fill="#1f77b4"/><text x="611.1" y="109.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">5,4 km/s</text><text x="318.0" y="149.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Reentrada desde órbita baja</text><rect x="330.0" y="130" width="396.0" height="26" fill="#2a7f62"/><text x="734.0" y="149.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">7,8 km/s</text><text x="318.0" y="189.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Reentrada desde la Luna (Artemis I)</text><rect x="330.0" y="170" width="560.0" height="26" fill="#c1440e"/><text x="898.0" y="189.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">11,1 km/s</text><text x="24.0" y="262.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">La energía por kilo es 2.0 veces mayor que desde órbita baja (61 frente a 31 MJ/kg).</text></svg>