<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="t d"><title id="t">Línea de tiempo de entrada, descenso y aterrizaje</title><desc id="d">Línea de tiempo con ocho eventos desde la separación de la etapa de crucero hasta el contacto con el suelo de Marte, en unos siete minutos.</desc><rect width="980" height="460" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Entrada, descenso y aterrizaje de Mars 2020</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Eventos en orden, no a escala. Tiempos desde la interfaz de entrada. Cifras redondeadas: verifica.</text><line x1="90.0" y1="250.0" x2="910.0" y2="250.0" stroke="#1d2733" stroke-width="3"/><rect x="207.1" y="240.0" width="702.9" height="20" fill="#c1440e" opacity="0.18"/><text x="558.6" y="400.0" font-size="14" fill="#c1440e" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">≈ 7 minutos de entrada, descenso y aterrizaje, sin control desde la Tierra</text><line x1="90.0" y1="250.0" x2="90.0" y2="186.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="90.0" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="90.0" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T-600 s</text><text x="90.0" y="180.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Separación del crucero</text><text x="90.0" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 10 min antes</text><line x1="207.1" y1="250.0" x2="207.1" y2="296.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="207.1" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="207.1" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T = 0</text><text x="207.1" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Interfaz de entrada</text><text x="207.1" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 125 km · ≈ 5,4 km/s</text><line x1="324.3" y1="250.0" x2="324.3" y2="186.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="324.3" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="324.3" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+80 s</text><text x="324.3" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Calentamiento máximo</text><text x="324.3" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">escudo térmico de 4,5 m</text><line x1="441.4" y1="250.0" x2="441.4" y2="296.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="441.4" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="441.4" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+240 s</text><text x="441.4" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Paracaídas</text><text x="441.4" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 11 km · ≈ Mach 1,7</text><line x1="558.6" y1="250.0" x2="558.6" y2="186.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="558.6" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="558.6" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+260 s</text><text x="558.6" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Sale el escudo</text><text x="558.6" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">navegación por el terreno</text><line x1="675.7" y1="250.0" x2="675.7" y2="296.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="675.7" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="675.7" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+330 s</text><text x="675.7" y="328.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Descenso propulsado</text><text x="675.7" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">se suelta la cubierta</text><line x1="792.9" y1="250.0" x2="792.9" y2="186.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="792.9" cy="250.0" r="8" fill="#2a7f62" stroke="#fff" stroke-width="2"/><text x="792.9" y="160.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+400 s</text><text x="792.9" y="180.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Grúa aérea</text><text x="792.9" y="197.0" font-size="12" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">el rover baja con cables</text><line x1="910.0" y1="250.0" x2="910.0" y2="296.0" stroke="#5b6b7c" stroke-width="1"/><circle cx="910.0" cy="250.0" r="8" fill="#c1440e" stroke="#fff" stroke-width="2"/><text x="910.0" y="310.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">T+415 s</text><text x="910.0" y="328.0" font-size="13" fill="#1d2733" text-anchor="end" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Contacto</text><text x="910.0" y="345.0" font-size="12" fill="#5b6b7c" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">≈ 0,75 m/s</text><text x="24.0" y="430.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">La señal tarda ≈ 11 min hasta la Tierra: cuando llega el aviso de «entrada», el vehículo ya terminó.</text></svg>