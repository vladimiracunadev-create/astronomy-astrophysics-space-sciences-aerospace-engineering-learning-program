<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" width="980" height="360" role="img" aria-labelledby="t d"><title id="t">Reparto de masas de Mars 2020</title><desc id="d">Barra horizontal dividida en cuatro tramos: rover 1025 kilos, etapa de descenso 2070, etapa de crucero 540 y escudo con cápsula trasera 410.</desc><rect width="980" height="360" fill="#ffffff"/><text x="24.0" y="36.0" font-size="20" fill="#1d2733" text-anchor="start" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Reparto aproximado de la masa al lanzamiento</text><text x="24.0" y="58.0" font-size="13" fill="#5b6b7c" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Total ≈ 4.045 kg. Cifras redondeadas de referencia pública: verifica en la hoja de datos.</text><rect x="40.0" y="110" width="228.1" height="70" fill="#2a7f62"/><line x1="154.0" y1="180" x2="154.0" y2="200" stroke="#5b6b7c"/><text x="154.0" y="216.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Rover (con instrumentos)</text><text x="154.0" y="233.0" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1025 kg · 25 %</text><rect x="268.1" y="110" width="460.6" height="70" fill="#c1440e"/><line x1="498.3" y1="180" x2="498.3" y2="244" stroke="#5b6b7c"/><text x="498.3" y="260.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Etapa de descenso (con combustible)</text><text x="498.3" y="277.0" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">2070 kg · 51 %</text><rect x="728.6" y="110" width="120.1" height="70" fill="#1f77b4"/><line x1="788.7" y1="180" x2="788.7" y2="200" stroke="#5b6b7c"/><text x="788.7" y="216.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Etapa de crucero</text><text x="788.7" y="233.0" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">540 kg · 13 %</text><rect x="848.8" y="110" width="91.2" height="70" fill="#8a6d3b"/><line x1="894.4" y1="180" x2="894.4" y2="244" stroke="#5b6b7c"/><text x="894.4" y="260.0" font-size="13" fill="#1d2733" text-anchor="middle" font-weight="bold" font-family="Segoe UI, Arial, sans-serif">Escudo y cápsula</text><text x="894.4" y="277.0" font-size="13" fill="#5b6b7c" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">410 kg · 10 %</text><text x="24.0" y="330.0" font-size="13" fill="#1d2733" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">Lo que llega a la superficie es solo ≈ 25 % de lo que sale de la Tierra hacia Marte: el resto se gasta o se descarta en el camino.</text></svg>